name: Build NEXORA AI DRAMA Capacitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - integration/capacitor-complete-package
    paths:
      - 'integrations/capacitor-package/**'
      - '.github/workflows/nexora-capacitor-apk.yml'

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/capacitor-package
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify web app entry point
        run: test -f www/index.html
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and sync Android
        run: |
          npm install
          npx cap add android || true
          npx cap sync android
      - name: Inject AdMob application ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'com.google.android.gms.ads.APPLICATION_ID' "$MANIFEST"; then
            sed -i "s|</application>|    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\\n    </application>|" "$MANIFEST"
          fi
      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-drama-capacitor-debug-apk
          path: integrations/capacitor-package/android/app/build/outputs/apk/debug/app-debug.apk
