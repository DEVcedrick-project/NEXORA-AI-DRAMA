name: Build NEXORA AI DRAMA APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - 'supabase/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main, 'improvements/**']
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'google-services.json'
      - 'supabase/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: nexora-ai-drama-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check viewer JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("www/index.html").read_text()
          start = html.find('<script type="module">')
          if start < 0:
              raise SystemExit("Module script not found")
          start = html.find('>', start) + 1
          end = html.find('</script>', start)
          if end < 0:
              raise SystemExit("Module script closing tag not found")
          Path("/tmp/nexora-viewer.mjs").write_text(html[start:end])
          PY
          node --check /tmp/nexora-viewer.mjs

      - name: Validate published catalog input boundaries
        run: node scripts/validate-catalog-safety.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install
      - name: Validate Firebase Realtime Database security rules
        run: node scripts/validate-firebase-rules.mjs

      - name: Validate client cloud security boundaries
        run: node scripts/validate-client-cloud-boundaries.mjs

      - name: Verify push registration rejects unauthenticated requests
        run: bash scripts/test-push-registration-auth.sh

      - name: Bundle native notification bridges locally
        run: npm run build-native-plugins

      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android
      - name: Add resilient Maven Central mirror for Android builds
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("android")
          files = list(root.rglob("*.gradle"))
          changed = 0
          for path in files:
              source = path.read_text()
              if "mavenCentral()" not in source:
                  continue
              mirror = "maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }"
              if mirror in source:
                  continue
              source = source.replace(
                  "mavenCentral()",
                  mirror + "\n        mavenCentral()"
              )
              path.write_text(source)
              changed += 1

          if changed < 2:
              raise SystemExit(
                  f"Expected to add Maven Central mirror to at least two Gradle files; changed {changed}."
              )
          print(f"Added Google-hosted Maven Central fallback to {changed} Gradle files.")
          PY
      - name: Install native in-app APK updater
        run: |
          python scripts/install-native-updater.py
      - name: Configure NEXORA AI DRAMA Firebase Android app
        run: |
          test -s google-services.json
          python - <<'PY'
          import json, re, shutil
          from pathlib import Path

          config = json.loads(Path("google-services.json").read_text())
          package = "com.devcedrick.nexoraaidrama"
          matches = [
              client for client in config.get("client", [])
              if client.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
          ]
          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one Firebase Android registration for {package}; found {len(matches)}")
          if config.get("project_info", {}).get("project_id") != "nexora-ai-drama":
              raise SystemExit("Firebase project mismatch; refusing to build")

          shutil.copy2("google-services.json", "android/app/google-services.json")

          root_gradle = Path("android/build.gradle")
          root_text = root_gradle.read_text()
          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"dependencies\s*\{", root_text)
              if not match:
                  raise SystemExit("Could not find Android root Gradle dependencies block for Google Services plugin")
              insert_at = match.end()
              root_text = root_text[:insert_at] + "\n        classpath 'com.google.gms:google-services:4.4.4'" + root_text[insert_at:]
              root_gradle.write_text(root_text)

          app_gradle = Path("android/app/build.gradle")
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              plugin_match = re.search(r"apply plugin:\s*['\"]com\.android\.application['\"]", app_text)
              if plugin_match:
                  insert_at = plugin_match.end()
                  app_text = app_text[:insert_at] + "\napply plugin: 'com.google.gms.google-services'" + app_text[insert_at:]
              else:
                  plugins_match = re.search(r"plugins\s*\{", app_text)
                  if not plugins_match:
                      raise SystemExit("Could not find Android app plugin declaration")
                  insert_at = plugins_match.end()
                  app_text = app_text[:insert_at] + "\n    id 'com.google.gms.google-services'" + app_text[insert_at:]
              app_gradle.write_text(app_text)

          print(f"Configured Firebase project {config['project_info']['project_id']} for {package}")
          PY
      - name: Harden Android app data and network settings
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          match = re.search(r"<application\b[^>]*", xml)
          if not match:
              raise SystemExit("Android application manifest element not found")
          tag = match.group(0)
          for key in ("allowBackup", "usesCleartextTraffic"):
              attr = f'android:{key}="false"'
              if re.search(rf"android:{key}\s*=", tag):
                  tag = re.sub(rf'android:{key}\s*=\s*"[^"]*"', attr, tag, count=1)
              else:
                  tag += " " + attr
          xml = xml[:match.start()] + tag + xml[match.end():]
          manifest.write_text(xml)
          assert 'android:allowBackup="false"' in xml
          assert 'android:usesCleartextTraffic="false"' in xml
          print("Disabled Android app backup and cleartext network traffic.")
          PY

      - name: Enforce Google Play target API 36
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          gradle = Path("android/variables.gradle")
          if not gradle.exists():
              raise SystemExit("Capacitor Android variables.gradle not found")
          text = gradle.read_text()
          for key in ("compileSdkVersion", "targetSdkVersion"):
              pattern = rf"({key}\s*=\s*)\d+"
              text, count = re.subn(pattern, rf"\g<1>36", text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not enforce {key}=36")
          gradle.write_text(text)
          print("Android compileSdkVersion and targetSdkVersion set to 36")
          PY

      - name: Set Android version from package.json
        id: version
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          html = Path("www/index.html")
          html_text = html.read_text()
          html_text, count = re.subn(r"const APP_CURRENT_VERSION = [^;]+;", f"const APP_CURRENT_VERSION = 'v{version}';", html_text, count=1)
          if count != 1:
              raise SystemExit("Could not inject current app version into updater")
          html_text, profile_count = re.subn(
              r'(id="profile-app-version"[^>]*>)[^<]*(</strong>)',
              rf'\g<1>v{version}\g<2>', html_text, count=1
          )
          if profile_count != 1:
              raise SystemExit("Could not inject profile app version")
          html_text, badge_count = re.subn(
              r'(id="ota-version-badge"[^>]*>)[^<]*(</span>)',
              rf'\g<1>v{version} → v{version}\g<2>', html_text, count=1
          )
          if badge_count != 1:
              raise SystemExit("Could not inject OTA version badge")
          html.write_text(html_text)
          major, minor, patch = (int(part) for part in version.split("."))
          version_code = major * 1000000 + minor * 1000 + patch
          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          text, count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', text, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode")
          text, count = re.subn(r'versionName\s+"[^"]*"', f'versionName "{version}"', text, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName")
          gradle.write_text(text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"value={version}\n")
          print(f"Android version: {version} ({version_code})")
          PY

      # Version injection runs after cap sync; copy the stamped HTML into the APK before building.
      - name: Copy version-stamped web assets into Android APK
        run: npx cap copy android

      - name: Generate premium launcher icon and splash assets
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate_branding.py

      - name: Configure AdMob application ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          app_id = os.environ.get("ADMOB_APP_ID") or "ca-app-pub-4497851143738030~6143841058"
          metadata = f'    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}"/>\n'
          if "com.google.android.gms.ads.APPLICATION_ID" in text:
              import re
              text = re.sub(
                  r'<meta-data\s+android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"\s+android:value="[^"]*"\s*/>',
                  metadata.strip(),
                  text,
                  count=1
              )
          else:
              text = text.replace("</application>", metadata + "    </application>", 1)
          manifest.write_text(text)
          PY

      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Production release blocked: permanent Android signing secrets are missing. Refusing to publish or label a debug APK as an update."
              exit 1
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are unavailable; this non-production run may build a debug APK for testing only."
          fi

      - name: Build debug APK
        if: steps.signing.outputs.enabled != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Debug APK build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle dependency resolution failed; retrying in $((attempt * 30)) seconds..."
            sleep $((attempt * 30))
          done

      - name: Prepare permanent release signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-key.jks

      - name: Build and sign release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 assembleRelease bundleRelease; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Signed APK/AAB build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle dependency resolution failed; retrying in $((attempt * 30)) seconds..."
            sleep $((attempt * 30))
          done
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app/build/outputs/apk/release/app-release-aligned.apk"
          SIGNED="app/build/outputs/apk/release/NEXORA-AI-DRAMA-release.apk"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks release-key.jks --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"
          rm -f "$ALIGNED"

      - name: Verify production APK package and release metadata
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/NEXORA-AI-DRAMA-release.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          BADGING="$("$BUILD_TOOLS/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.devcedrick.nexoraaidrama'"
          EXPECTED_VERSION="$(node -p "require('../package.json').version")"
          echo "$BADGING" | grep -F "versionName='$EXPECTED_VERSION'"
          EXPECTED_CODE="$(node -e "const [a,b,c]=require('../package.json').version.split('.').map(Number); process.stdout.write(String(a*1000000+b*1000+c))")"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
          echo "Production APK package ID, version, file, and APK signature checks passed."

      - name: Deep-validate APK archive and Android package parser
        if: steps.signing.outputs.enabled == 'true' || steps.signing.outputs.enabled == 'false'
        working-directory: android
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.enabled }}" = "true" ]; then
            APK="app/build/outputs/apk/release/NEXORA-AI-DRAMA-release.apk"
          else
            APK="app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "$APK"
          echo "Checking APK ZIP container integrity..."
          unzip -tq "$APK"
          echo "Checking required Android package entries..."
          unzip -Z1 "$APK" | grep -Fx "AndroidManifest.xml"
          unzip -Z1 "$APK" | grep -Fx "resources.arsc"
          unzip -Z1 "$APK" | grep -E '(^|/)classes[0-9]*\.dex$'
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "Verifying APK signature..."
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "Parsing compiled Android manifest..."
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.devcedrick.nexoraaidrama'"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > /tmp/nexora-manifest-tree.txt
          grep -F "com.devcedrick.nexoraaidrama" /tmp/nexora-manifest-tree.txt
          echo "APK archive, signature, package ID and binary manifest checks passed."

      - name: Enable KVM hardware acceleration for Android emulator
        if: steps.signing.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners expose KVM but may not grant the
          # runner user access until the recommended udev rule is applied.
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo chmod 666 /dev/kvm || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM is available to the runner; emulator will use hardware acceleration."
            ls -l /dev/kvm
          else
            echo "::warning::KVM is unavailable to this runner. Enabling the Android Emulator TCG compatibility fallback instead of failing the entire APK build."
            echo "ANDROID_I_WANT_MY_TCG=yes" >> "$GITHUB_ENV"
          fi

      - name: Test real in-place upgrade from the previous signed release
        if: steps.signing.outputs.enabled == 'true' && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')))
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-linux-hw-accel: auto
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/test-inplace-upgrade.sh"
      - name: Sign release AAB
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          UNSIGNED="app/build/outputs/bundle/release/app-release.aab"
          SIGNED="app/build/outputs/bundle/release/NEXORA-AI-DRAMA-release.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$SIGNED" "$UNSIGNED" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$SIGNED"
          test -s "$SIGNED"
          rm -f release-key.jks

      - name: Publish signed APK and AAB as GitHub Release
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: NEXORA AI DRAMA v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/release/NEXORA-AI-DRAMA-release.apk
            android/app/build/outputs/bundle/release/NEXORA-AI-DRAMA-release.aab
          overwrite_files: true
          generate_release_notes: false
          make_latest: true

      - name: Publish update manifest after successful signed release
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v8
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
        with:
          script: |
            const version = process.env.APP_VERSION;
            const path = 'update.json';
            const fs = require('fs');
            const crypto = require('crypto');
            const apkPath = 'android/app/build/outputs/apk/release/NEXORA-AI-DRAMA-release.apk';
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(apkPath)).digest('hex');
            const manifest = {
              version,
              title: `NEXORA AI DRAMA v${version}`,
              notes: 'Adds official APK SHA-256 verification and full archive integrity checks before Android installation.',
              sha256,
              downloadUrl: `https://github.com/DEVcedrick-project/NEXORA-AI-DRAMA/releases/download/v${version}/NEXORA-AI-DRAMA-release.apk`
            };
            const content = Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64');
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'
            });
            const existing = Buffer.from(current.data.content, 'base64').toString('utf8');
            if (JSON.stringify(JSON.parse(existing)) === JSON.stringify(manifest)) {
              core.info('Update manifest already points to this release.');
            } else {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner, repo: context.repo.repo, path,
                message: `Publish NEXORA AI DRAMA v${version} update manifest`,
                content,
                sha: current.data.sha,
                branch: 'main'
              });
              core.info(`Published update manifest for v${version}.`);
            }

      - name: Notify Android users about the new app version
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          NEXORA_RELEASE_WEBHOOK_SECRET: ${{ secrets.NEXORA_RELEASE_WEBHOOK_SECRET }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ -z "$NEXORA_RELEASE_WEBHOOK_SECRET" ]; then
            echo "::warning::APK/AAB release succeeded, but NEXORA_RELEASE_WEBHOOK_SECRET is missing; update notification was skipped."
            exit 0
          fi
          HTTP_STATUS="$(curl --silent --show-error --retry 2 --retry-delay 3 \
            -o /tmp/nexora-push-response.json -w "%{http_code}" \
            -X POST "https://vureiymqoosubwubhvdu.supabase.co/functions/v1/nexora-push-broadcast" \
            -H "Content-Type: application/json" \
            -H "x-nexora-release-secret: $NEXORA_RELEASE_WEBHOOK_SECRET" \
            --data "{\"version\":\"$APP_VERSION\"}")"
          cat /tmp/nexora-push-response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning::APK/AAB release succeeded, but update notification failed with HTTP $HTTP_STATUS. Match the GitHub and Supabase NEXORA_RELEASE_WEBHOOK_SECRET values, then retry the notification."
            exit 1
          fi

      - name: Upload signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-AI-DRAMA-Play-Store-Bundle
          path: |
            android/app/build/outputs/apk/release/NEXORA-AI-DRAMA-release.apk
            android/app/build/outputs/bundle/release/NEXORA-AI-DRAMA-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store app icon
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-AI-DRAMA-Play-Store-Assets
          path: resources/play-store/icon-512.png
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK (testing only)
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: NEXORA-AI-DRAMA-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
