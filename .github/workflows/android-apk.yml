name: Build NEXORA AI DRAMA APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'supabase/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'supabase/**'
      - 'resources/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check viewer JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("www/index.html").read_text()
          start = html.find('<script type="module">')
          if start < 0:
              raise SystemExit("Module script not found")
          start = html.find('>', start) + 1
          end = html.find('</script>', start)
          if end < 0:
              raise SystemExit("Module script closing tag not found")
          Path("/tmp/nexora-viewer.mjs").write_text(html[start:end])
          PY
          node --check /tmp/nexora-viewer.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Generate Android project and sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate premium launcher icon and splash assets
        run: |
          python -m pip install --disable-pip-version-check cairosvg pillow
          python scripts/generate_branding.py

      - name: Configure AdMob application ID
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              app_id = os.environ.get("ADMOB_APP_ID") or "ca-app-pub-3940256099942544~3347511713"
              metadata = f'    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}"/>\n'
              text = text.replace("</application>", metadata + "    </application>", 1)
              manifest.write_text(text)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-AI-DRAMA-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
