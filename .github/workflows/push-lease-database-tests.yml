name: Push lease RPC database tests

on:
  pull_request:
    paths:
      - "supabase/migrations/*push_delivery_lease*"
      - "supabase/migrations/20261128010000_nexora_push_delivery_lease_v2.sql"
      - "supabase/tests/**"
      - ".github/workflows/push-lease-database-tests.yml"
  push:
    branches:
      - "audit/push-delivery-lease-retries"
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/push-lease-database-tests.yml"

permissions:
  contents: read

jobs:
  postgres-rpc-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap disposable baseline
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/tests/fixtures/push_lease_baseline.sql
      - name: Apply prior push migrations and candidate v2 migration
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/migrations/20261127034051_atomic_push_broadcast_claims.sql
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/migrations/20261127082828_add_push_delivery_progress.sql
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/migrations/20261128010000_nexora_push_delivery_lease_v2.sql
      - name: Apply audited push reconciliation migration
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/migrations/20261128020000_nexora_push_delivery_reconciliation_v1.sql
      - name: Apply opaque delivery identifier migration
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/migrations/20261128030000_nexora_push_reconciliation_admin_v1.sql
      - name: Apply push reconciliation rate limit migration
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/migrations/20261128040000_nexora_push_reconciliation_rate_limits_v1.sql
      - name: Run RPC behavior and privilege assertions
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/tests/nexora_push_delivery_lease_v2.sql
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/tests/nexora_push_delivery_reconciliation_v1.sql
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/tests/nexora_push_reconciliation_admin_v1.sql
          docker exec -i "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 < supabase/tests/nexora_push_reconciliation_rate_limits_v1.sql
      - name: Prove concurrent reconciliation is idempotent for one delivery
        shell: bash
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          docker exec "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 -c "insert into public.nexora_push_deliveries(event_key, token, status, last_error_code) values ('parallel-reconcile-test', 'parallel-reconcile-token', 'unknown', 'NETWORK_RESPONSE_UNKNOWN')"
          for i in $(seq 1 20); do
            (docker exec "$db" psql -U postgres -d nexora_test -X -Atqc "select public.nexora_reconcile_push_delivery_v1('parallel-reconcile-test', 'parallel-reconcile-token', 'parallel-provider-proof', 'verified provider acceptance under concurrent test', 'ci-operator')" > "/tmp/push-reconcile-$i.out") &
          done
          wait
          reconciled=$(grep -hxc reconciled /tmp/push-reconcile-*.out | awk '{ total += $1 } END { print total + 0 }')
          repeated=$(grep -hxc already_reconciled /tmp/push-reconcile-*.out | awk '{ total += $1 } END { print total + 0 }')
          if [ "$reconciled" -ne 1 ] || [ "$repeated" -ne 19 ]; then
            echo "Expected one reconciliation and 19 idempotent repeats; got reconciled=$reconciled repeated=$repeated"
            cat /tmp/push-reconcile-*.out
            exit 1
          fi
          docker exec "$db" psql -U postgres -d nexora_test -v ON_ERROR_STOP=1 -c "delete from public.nexora_push_delivery_reconciliations where event_key = 'parallel-reconcile-test'; delete from public.nexora_push_deliveries where event_key = 'parallel-reconcile-test'"
          echo "Concurrent reconciliation test passed: one transition, 19 idempotent repeats."
      - name: Prove concurrent claims admit exactly one worker
        shell: bash
        run: |
          db=$(docker ps -q --filter ancestor=postgres:16 | head -n1)
          for i in $(seq 1 20); do
            (docker exec "$db" psql -U postgres -d nexora_test -X -Atqc "select public.nexora_claim_push_event_v2('parallel-claim-test', 'parallel-claim-token-$(printf '%08d' "$i")', 60)" > "/tmp/push-claim-$i.out") &
          done
          wait
          successes=$(grep -hxc t /tmp/push-claim-*.out | awk '{ total += $1 } END { print total + 0 }')
          if [ "$successes" -ne 1 ]; then
            echo "Expected exactly one successful claim, got $successes"
            cat /tmp/push-claim-*.out
            exit 1
          fi
          echo "Concurrent claim test passed: exactly one of 20 workers acquired the event."
